# nginx reverse-proxy for self-hosted ClawHub
#
# Mirrors the Vercel rewrite rules in vercel.json:
#   /api/* → Convex backend (HTTP actions + REST API)
#   /*     → TanStack Start / Nitro frontend

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ── upstream services ─────────────────────────────────────────────────
    upstream convex_backend {
        server convex:3210;
    }

    upstream app_frontend {
        server app:3000;
    }

    # ── main server ───────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Generous timeouts for file uploads and long-running actions
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout  10s;

        # Forward real client IP so rate-limiting works correctly
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── /api/* → Convex backend ──────────────────────────────────────
        # Mirrors vercel.json: { source: "/api/:path*", destination: "<convex-site>/api/:path*" }
        location /api/ {
            proxy_pass http://convex_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Allow large skill uploads (matches Convex 50 MB limit)
            client_max_body_size 55m;
        }

        # ── /* → TanStack Start frontend ─────────────────────────────────
        location / {
            proxy_pass http://app_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
